name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR rejects image names with uppercase characters,
  # and ${{ github.repository }} would resolve to "Nikanwar3/searchsphere".
  IMAGE_NAME: nikanwar3/searchsphere

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: searchsphere
          POSTGRES_USER: searchsphere
          POSTGRES_PASSWORD: searchsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchsphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://searchsphere:searchsphere@localhost:5432/searchsphere
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  docker-build:
    # Fast feedback on every push/PR: the image builds cleanly. Doesn't
    # need registry auth, so it runs even on PRs from forks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t searchsphere:ci .

  publish:
    # CD: only on pushes to main (never on PRs), and only once tests and the
    # build both pass. Pushes to GitHub Container Registry using the
    # workflow's own GITHUB_TOKEN -- no registry secrets to manage.
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy manifests (if a cluster is configured)
        # No KUBE_CONFIG_DATA secret exists in this repo yet, so this step
        # is skipped (not a no-op run) until one is added -- a self-hosted
        # cluster, kind-in-CI, or a managed cluster's kubeconfig. The image
        # is published to GHCR above regardless; this step only adds "also
        # roll a live cluster" once there's an actual cluster to roll onto.
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          (cd k8s && kustomize edit set image "${REGISTRY}/${IMAGE_NAME}=${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}")
          kubectl apply -k k8s/
          kubectl -n searchsphere rollout status deployment/searchsphere-api
