apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: searchsphere

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - api-service.yaml
  # - ingress.yaml   # uncomment if the cluster has ingress-nginx installed
  # secret.example.yaml is a template, not a resource -- create the real
  # Secret separately (see secret.example.yaml's header comment) before
  # applying this kustomization.

images:
  - name: ghcr.io/nikanwar3/searchsphere
    newTag: latest # CD overrides this to the commit SHA at deploy time
