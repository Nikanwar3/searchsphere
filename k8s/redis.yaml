# Self-contained Redis for demo/dev clusters, mirroring docker-compose.yml.
# Cache data only (IndexManager + Postgres are the sources of truth), so no
# PVC: losing this pod just means a cold cache, not data loss.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchsphere-redis
  namespace: searchsphere
  labels:
    app.kubernetes.io/name: searchsphere-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searchsphere-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searchsphere-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: searchsphere-redis
  namespace: searchsphere
spec:
  selector:
    app.kubernetes.io/name: searchsphere-redis
  ports:
    - port: 6379
      targetPort: 6379
