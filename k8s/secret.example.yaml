# Template only -- DO NOT commit a real "secret.yaml" with actual credentials.
#
# Preferred: create the Secret imperatively so nothing sensitive ever touches
# git history:
#
#   kubectl create secret generic searchsphere-secrets \
#     --namespace searchsphere \
#     --from-literal=DATABASE_URL='postgresql+psycopg://searchsphere:<password>@searchsphere-postgres:5432/searchsphere' \
#     --from-literal=REDIS_URL='redis://searchsphere-redis:6379/0' \
#     --from-literal=POSTGRES_PASSWORD='<password>'
#
# Or copy this file to secret.yaml (already .gitignored), fill in real
# values, and `kubectl apply -f k8s/secret.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: searchsphere-secrets
  namespace: searchsphere
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://searchsphere:CHANGE_ME@searchsphere-postgres:5432/searchsphere"
  REDIS_URL: "redis://searchsphere-redis:6379/0"
  POSTGRES_PASSWORD: "CHANGE_ME"
